name: CI - pytest + Docker Compose (PostgreSQL)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-compose:
    runs-on: ubuntu-latest

    steps:
      # 1) Récupérer le code
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Installer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) Installer dépendances + tests unitaires
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        run: |
          pytest -q

      # 4) Installer docker-compose (v1) sur runner Ubuntu (simple)
      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # 5) Build + up de la stack (API + PostgreSQL)
      - name: Docker Compose up
        run: |
          docker-compose up -d --build

      # 6) Attendre que l'API réponde puis tester les endpoints
      - name: Wait for API and test endpoints
        run: |
          # attendre jusqu'à 30s que l'API soit prête
          for i in $(seq 1 30); do
            if curl -s http://localhost:5000/ >/dev/null; then
              echo "API is up"
              break
            fi
            echo "Waiting for API... ($i)"
            sleep 1
          done

          echo "Test /"
          curl -s http://localhost:5000/ | grep "API is running"

          echo "Test /health"
          curl -s http://localhost:5000/health | grep "\"status\":\"ok\""

      # 7) Down (toujours exécuté)
      - name: Docker Compose down
        if: always()
        run: |
          docker-compose down -v
