      - name: Wait for API and DB, then test endpoints
        run: |
          # Attendre jusqu'à 60s que /health soit OK (DB connectée)
          for i in $(seq 1 60); do
            if curl -s http://localhost:5000/health | grep -q '"status":"ok"'; then
              echo "Health is OK (API + DB ready)"
              break
            fi
            echo "Waiting for /health... ($i)"
            sleep 1
          done

          echo "Test /"
          curl -s http://localhost:5000/ | grep -q "API is running"

          echo "Test /health"
          curl -s http://localhost:5000/health | grep -q '"status":"ok"'
      - name: Debug logs (only if failed)
        if: failure()
        run: |
          docker-compose ps
          docker-compose logs --no-color --tail=200
